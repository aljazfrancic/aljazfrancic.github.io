[about]
text.en = "I take ideas all the way to working systems and know what to leave out. I work on problems until they yield, read widely outside the engineering canon, and prefer to find my own errors first."
text.sl = "Ideje pripeljem vse do delujočih sistemov in vem, kaj izpustiti. Pri problemih vztrajam, dokler ne popustijo, veliko berem tudi izven inženirskega kanona, svoje napake pa raje odkrijem sam, preden jih kdo drug."

