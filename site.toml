# Everything the site says, in both languages. `npm run build` turns it into the English page
# (index.html), the Slovenian one (sl/index.html) and the sitemap; the HTML around the content
# lives in scripts/template.mjs.
#
# - Text that differs by language is a pair: title.en = "…" and title.sl = "…", or
#   title = { en = "…", sl = "…" }. A plain string is the same on both pages.
# - In longer text, [words](https://…) is a link (it opens in a new tab), and   is a
#   non-breaking space. Write & and quotes as they are; the build escapes them.
# - Project tags and the topics in knows_about are written in English and translated through
#   [glossary] at the end, since the same ones repeat.
# - English is British (colour, recognise). No em dashes anywhere: a colon or a comma instead.

