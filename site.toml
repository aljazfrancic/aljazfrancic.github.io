text.en = "Ran a pre-registered study of cross-layer dynamics in transformer factual recall across six language models, on consumer hardware. Studied grokking in electromyography gesture classifiers. Shipped a Magic: The Gathering cEDH deck-comparison web app, an LLM extraction cascade and other projects."
