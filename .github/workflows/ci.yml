# Builds the site once, tests that very build in every engine and with Lighthouse, and on main
# deploys exactly it to GitHub Pages, but only when every test has passed.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch replaces a run still in progress there. Not on main: each push there
# gets its own run, and deploys in order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate (W3C)
        run: npm run validate
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browsers:
    name: Chromium, Firefox, WebKit
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwright's own image: the browsers and everything they need are already in it (installing
    # them on the runner fetches 100+ MB of system packages, at times very slowly). Its version
    # must match @playwright/test in package.json; user 1001 is the runner's, who owns the files.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Unpack the build
        uses: actions/download-artifact@v8
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Browser tests
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  lighthouse:
    name: Lighthouse (${{ matrix.form-factor }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    # In Playwright's image too: Lighthouse runs in Playwright's pinned Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Unpack the build
        uses: actions/download-artifact@v8
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - run: npm run lighthouse -- --form-factor ${{ matrix.form-factor }} --runs 5
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.form-factor }}
          path: lighthouse-reports/

  # Twice, side by side: with the Mac's Reduce Motion on (the backdrop holds a still frame) and
  # off (it flies). GitHub's macOS runners come with it on.
  safari:
    name: Safari (macOS, Reduce Motion ${{ matrix.reduced-motion }})
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        reduced-motion: ["on", "off"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unpack the build
        uses: actions/download-artifact@v8
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - run: sudo safaridriver --enable
      - name: Set Reduce Motion ${{ matrix.reduced-motion }}
        run: defaults write com.apple.universalaccess reduceMotion -bool ${{ matrix.reduced-motion == 'on' }}
      - run: npm run safari
        env:
          REDUCED_MOTION: ${{ matrix.reduced-motion }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: safari-screenshots-${{ matrix.reduced-motion }}
          path: test-results/safari/

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: [browsers, lighthouse, safari]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
